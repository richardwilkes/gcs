name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Same target set the Unison packager (upack) supports. GCS is pure Go now — Unison and pdfview both reach the
        # platform APIs through purego, so there are no C toolchains or per-arch static libraries in the picture and
        # every target cross-compiles cleanly. Each one is still built on its own runner so that the tests execute on
        # the platform they ship for and the uploaded artifact is a natively produced binary.
        os: [ubuntu-22.04, ubuntu-22.04-arm, macos-26-intel, macos-26, windows-2022, windows-11-arm]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux runtime libraries
        if: runner.os == 'Linux'
        run: |
          # Unison dlopen's libX11.so.6 and libGL.so.1 the first time it touches the display. Nothing links against
          # them at build time, so only the runtime packages are needed here — no development headers, no pkg-config.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-6 libgl1

      - name: Build
        run: |
          # The race detector supports only windows/amd64 on Windows, so build & test without it on windows/arm64.
          if [ "$RUNNER_OS" = "Windows" ] && [ "$RUNNER_ARCH" = "ARM64" ]; then
            ./build.sh --go --test
          else
            ./build.sh --go --race
          fi

      - name: Stage artifact
        id: stage
        run: |
          goos=$(go env GOOS)
          goarch=$(go env GOARCH)
          platform=$goos
          [ "$goos" = "darwin" ] && platform=macos
          bin=gcs
          [ "$goos" = "windows" ] && bin=gcs.exe
          mkdir -p dist
          mv "$bin" "dist/$bin"
          echo "artifact_name=gcs-$platform-$goarch" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.stage.outputs.artifact_name }}
          path: dist/
          if-no-files-found: error

  lint:
    name: Lint (${{ matrix.goos }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # ux carries per-platform sources (platform_{darwin,linux,windows}.go, menus_darwin.go, menus_other.go), so
        # each GOOS gets its own pass to make sure every file is actually analyzed. Nothing is architecture-specific,
        # so one GOARCH per GOOS is enough, and since none of this needs a C toolchain it all runs on Linux runners.
        goos: [darwin, linux, windows]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Lint via the official action rather than build.sh's --lint step: the latter downloads golangci-lint through its
      # upstream install.sh, whose checksum verification fails for unauthenticated release downloads in CI.
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        env:
          GOOS: ${{ matrix.goos }}
          GOEXPERIMENT: jsonv2,nodwarf5
        with:
          version: latest
